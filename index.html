<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>外業專用照片 GIS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --btn-height: 50px; }
        body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; font-family: -apple-system, sans-serif; background: #1a1a1a; }
        
        /* 頂部大型按鈕區 (方便手指點擊) */
        #ui-top { background: #333; padding: 10px; z-index: 1001; display: flex; flex-direction: column; gap: 8px; }
        .btn-row { display: flex; gap: 8px; width: 100%; }
        
        .main-btn { 
            flex: 1; height: var(--btn-height); border-radius: 8px; border: none; 
            font-size: 16px; font-weight: bold; color: white; display: flex; 
            align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn { background: #28a745; } /* 綠色拍照 */
        .folder-btn { background: #007bff; } /* 藍色選取 */
        .clear-btn { background: #6c757d; width: 80px; font-size: 14px; }

        #main-container { flex: 1; display: flex; position: relative; overflow: hidden; background: white; }
        #map { flex: 1; }
        
        /* 側邊清單優化 */
        #photo-list { width: 70px; background: #222; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 4px; }
        .list-item { width: 100%; aspect-ratio: 1; border-radius: 4px; overflow: hidden; position: relative; border: 2px solid transparent; }
        .list-item img { width: 100%; height: 100%; object-fit: cover; }
        .list-item span { position: absolute; top: 0; left: 0; background: rgba(0,0,0,0.7); color: white; font-size: 10px; padding: 2px; }
        
        /* 編號樣式 */
        .number-marker { background: #ff2d55; color: white; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        
        .popup-img { width: 100%; max-width: 240px; border-radius: 4px; }
        #status-bar { color: #aaa; font-size: 12px; text-align: center; }
        
        /* 隱藏原生 input */
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="ui-top">
    <div class="btn-row">
        <!-- 現場拍照按鈕 -->
        <button class="main-btn cam-btn" onclick="document.getElementById('input-cam').click()">📸 現場拍照</button>
        <!-- 從相簿選取 -->
        <button class="main-btn folder-btn" onclick="document.getElementById('input-folder').click()">📂 相簿匯入</button>
        <button class="clear-btn" onclick="clearAll()">清除</button>
    </div>
    <div id="status-bar">點擊按鈕開始記錄軌跡</div>
</div>

<!-- 隱藏的 Input -->
<input type="file" id="input-cam" accept="image/*" capture="camera">
<input type="file" id="input-folder" accept="image/*" multiple>

<div id="main-container">
    <div id="map"></div>
    <div id="photo-list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>

<script>
    const map = L.map('map', { zoomControl: false }).setView([23.5, 121], 7);
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
    L.control.layers({ "街道": osm, "衛星": sat }, null, { position: 'bottomleft' }).addTo(map);

    let photosData = [];
    const markerGroup = L.layerGroup().addTo(map);
    const trackLine = L.polyline([], { color: '#ff2d55', weight: 3, opacity: 0.6 }).addTo(map);

    // 處理上傳事件
    [document.getElementById('input-cam'), document.getElementById('input-folder')].forEach(input => {
        input.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            document.getElementById('status-bar').innerText = "處理中 (壓縮並解析)...";
            
            for (const file of files) {
                try {
                    const exif = await exifr.parse(file, { gps: true, device: true, timestamp: true });
                    if (exif && exif.latitude) {
                        // ⚡ 關鍵優化：前端自動壓縮圖片
                        const thumbUrl = await compressImage(file);
                        
                        photosData.push({
                            lat: exif.latitude,
                            lng: exif.longitude,
                            time: exif.DateTimeOriginal || new Date(file.lastModified),
                            heading: exif.GPSImgDirection || 0,
                            url: thumbUrl
                        });
                    } else {
                        alert("部分照片缺少 GPS 資訊，將無法顯示。");
                    }
                } catch (err) { console.error(err); }
            }
            photosData.sort((a, b) => a.time - b.time);
            renderData();
        });
    });

    // ⚡ 壓縮引擎：將大圖轉為小圖以節省效能
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max_size = 800; // 壓縮至最大 800px，這對手機顯示綽綽有餘
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > max_size) { height *= max_size / width; width = max_size; }
                    } else {
                        if (height > max_size) { width *= max_size / height; height = max_size; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); // 70% 畫質壓縮
                };
            };
        });
    }

    function renderData() {
        markerGroup.clearLayers();
        trackLine.setLatLngs([]);
        const listEl = document.getElementById('photo-list');
        listEl.innerHTML = '';
        const latlngs = [];

        photosData.forEach((data, index) => {
            const num = index + 1;
            const pos = [data.lat, data.lng];
            latlngs.push(pos);

            const icon = L.divIcon({
                className: '',
                html: `<div class="number-marker" style="width:28px; height:28px;">${num}</div>`,
                iconSize: [28, 28], iconAnchor: [14, 14]
            });

            const marker = L.marker(pos, { icon }).addTo(markerGroup);
            marker.bindPopup(`
                <div style="text-align:center">
                    <b>第 ${num} 點</b><br>
                    <img src="${data.url}" class="popup-img"><br>
                    <span style="font-size:20px; display:inline-block; transform:rotate(${data.heading}deg)">⬆</span>
                    方向: ${Math.round(data.heading)}°
                </div>
            `);

            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `<span>${num}</span><img src="${data.url}">`;
            item.onclick = () => { map.flyTo(pos, 18); marker.openPopup(); };
            listEl.appendChild(item);
        });

        trackLine.setLatLngs(latlngs);
        if (latlngs.length > 0) map.fitBounds(trackLine.getBounds(), { padding: [40, 40] });
        document.getElementById('status-bar').innerText = `已匯入 ${photosData.length} 張照片`;
    }

    function clearAll() {
        photosData = [];
        markerGroup.clearLayers();
        trackLine.setLatLngs([]);
        document.getElementById('photo-list').innerHTML = '';
        document.getElementById('status-bar').innerText = "已清除";
    }

    function clearAll() {
        if(confirm("確定要清除所有照片與軌跡嗎？")) {
            photosData = [];
            markerGroup.clearLayers();
            trackLine.setLatLngs([]);
            document.getElementById('photo-list').innerHTML = '';
            document.getElementById('status-bar').innerText = "已清除";
        }
    }
</script>
</body>
</html>
