<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>專業現勘調查報告系統 v3.8</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        :root { --primary: #007bff; --danger: #dc3545; }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f4f4f4; }
        
        #ui-header { background: #333; color: white; padding: 10px; z-index: 1001; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 14px; }
        .btn-blue { background: var(--primary); }
        .btn-green { background: #28a745; }
        .btn-red { background: var(--danger); }
        
        #main-view { flex: 1; display: flex; position: relative; overflow: hidden; }
        #map { flex: 1; height: 100%; z-index: 1; background: #fff; }
        #photo-list { width: 95px; background: #222; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 5px; }
        
        .list-thumb { width: 100%; aspect-ratio: 1; border-radius: 4px; object-fit: cover; cursor: pointer; }
        .marker-container { position: relative; width: 34px; height: 34px; }
        .number-marker { background: var(--danger); color: white; border: 2px solid white; border-radius: 50%; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; }
        .heading-pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid white; }
        .cluster-text-icon { background: #f39c12; color: white; border: 2.5px solid white; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; padding: 4px; white-space: nowrap; }

        /* 報表區塊 */
        #report-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; overflow-y: auto; color: black; padding: 0; }
        .report-page { page-break-after: always; width: 100%; max-width: 900px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        #report-map-snap { width: 100%; height: auto; border: 2px solid #333; margin: 15px 0; display: block; }
        .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .report-item { border: 1px solid #ddd; padding: 12px; border-radius: 5px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; page-break-inside: avoid; background: #fff; }
        .report-item img { width: 100%; height: 160px; object-fit: cover; border-radius: 3px; }
        .report-title { font-weight: bold; font-size: 26px; color: var(--primary); border-bottom: 4px solid var(--primary); padding-bottom: 10px; margin-bottom: 15px; text-align: center; }

        /* 重要：修復 iOS 列印問題的 CSS */
        @media print {
            body, html { height: auto !important; overflow: visible !important; }
            #ui-header, #main-view, .no-print { display: none !important; }
            #report-overlay { display: block !important; position: relative !important; width: 100% !important; height: auto !important; overflow: visible !important; }
            .report-page { padding: 0 !important; margin: 0 !important; width: 100% !important; }
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="ui-header" class="no-print">
    <div class="btn-group">
        <button class="btn btn-blue" onclick="document.getElementById('file-input').click()">📸 匯入照片</button>
        <button class="btn btn-green" onclick="generateReport()">📄 產生現勘報告</button>
        <button class="btn btn-red" onclick="if(confirm('確定清除？')) location.reload()">🔄 重置</button>
    </div>
</div>

<input type="file" id="file-input" multiple>

<div id="main-view" class="no-print">
    <div id="map"></div>
    <div id="photo-list"></div>
</div>

<div id="report-overlay">
    <div class="no-print" style="padding: 15px; background: #eee; border-bottom: 2px solid #ccc; display: flex; gap: 10px;">
        <button class="btn btn-red" onclick="document.getElementById('report-overlay').style.display='none'">⬅ 返回編輯</button>
        <!-- iOS 修正：直接呼叫 window.print() 並移除所有異步干擾 -->
        <button class="btn btn-green" onclick="window.print()">🖨️ 確認列印 / 存為 PDF</button>
    </div>
    <div id="report-content"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
    const map = L.map('map', { zoomControl: false }).setView([23.5, 121], 7);
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { crossOrigin: 'anonymous' }).addTo(map);
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { crossOrigin: 'anonymous' });
    L.control.layers({ "標準地圖": osm, "衛星影像": satellite }, null, { position: 'bottomleft' }).addTo(map);

    let photosData = [];
    const clusters = L.markerClusterGroup({ zoomToBoundsOnClick: false, spiderfyOnMaxZoom: false,
        iconCreateFunction: function(cluster) {
            const markers = cluster.getAllChildMarkers();
            const indices = markers.map(m => m.options.index).sort((a,b) => a-b);
            const label = indices.join(', ');
            const width = Math.max(35, label.length * 10 + 12);
            return L.divIcon({ html: `<div class="cluster-text-icon" style="width:${width}px; height:36px;">${label}</div>`, className: '', iconSize: [width, 36] });
        }
    });
    map.addLayer(clusters);
    clusters.on('clusterclick', a => { if (a.layer._spiderfied) { a.layer.unspiderfy(); } else { a.layer.spiderfy(); } });

    document.getElementById('file-input').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        for (let file of files) {
            try {
                const exif = await exifr.parse(file, { gps: true, timestamp: true });
                if (exif && exif.latitude) {
                    const thumb = await compressImage(file);
                    photosData.push({ lat: exif.latitude, lng: exif.longitude, time: exif.DateTimeOriginal || new Date(file.lastModified), url: thumb, note: "", name: file.name, heading: exif.GPSImgDirection || 0 });
                }
            } catch (err) { console.error(err); }
        }
        photosData.sort((a, b) => a.time - b.time);
        render();
    });

    async function compressImage(file) {
        return new Promise(res => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const size = 1200;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > size) { h *= size / w; w = size; } } else { if (h > size) { w *= size / h; h = size; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(canvas.toDataURL('image/jpeg', 0.85));
                };
            };
        });
    }

    function render() {
        clusters.clearLayers();
        const list = document.getElementById('photo-list');
        list.innerHTML = '';
        photosData.forEach((d, i) => {
            const num = i + 1;
            const marker = L.marker([d.lat, d.lng], { index: num, draggable: true,
                icon: L.divIcon({ className: '', html: `<div class="marker-container" style="transform: rotate(${d.heading}deg)"><div class="heading-pointer"></div><div class="number-marker" style="transform: rotate(${-d.heading}deg)">${num}</div></div>`, iconSize: [34, 34], iconAnchor: [17, 17] })
            });
            marker.on('dragend', e => { const n = e.target.getLatLng(); d.lat = n.lat; d.lng = n.lng; render(); });
            marker.bindPopup(`<div class="popup-box"><strong>NO.${num}</strong><img src="${d.url}" class="popup-img"><textarea class="note-area" onchange="updateNote(${i}, this.value)" placeholder="輸入備註...">${d.note}</textarea></div>`);
            clusters.addLayer(marker);
            const img = document.createElement('img');
            img.src = d.url; img.className = 'list-thumb';
            img.onclick = () => { map.flyTo([d.lat, d.lng], 18); clusters.zoomToShowLayer(marker, () => marker.openPopup()); };
            list.appendChild(img);
        });
        if (photosData.length > 0) map.fitBounds(clusters.getBounds().pad(0.2));
    }

    window.updateNote = (index, val) => { photosData[index].note = val; };

    async function generateReport() {
        if (photosData.length === 0) return alert("請先匯入照片");
        clusters.unspiderfy();
        map.fitBounds(clusters.getBounds().pad(0.15));
        const dates = [...new Set(photosData.map(d => d.time.toLocaleDateString()))].sort();
        const reportDateStr = dates.length > 1 ? `${dates[0]} - ${dates[dates.length-1]}` : dates[0];
        document.getElementById('report-content').innerHTML = "<h2 style='text-align:center; padding-top:100px;'>正在產出報告，請稍候...</h2>";
        document.getElementById('report-overlay').style.display = 'block';
        await new Promise(r => setTimeout(r, 1500));
        const mapElement = document.getElementById('map');
        const canvas = await html2canvas(mapElement, { useCORS: true, scale: 2, logging: false, ignoreElements: el => el.classList.contains('leaflet-control-container') });
        const mapImgData = canvas.toDataURL('image/png');
        let html = `<div class="report-page"><h1 class="report-title">現勘調查報告書</h1><p style="text-align:center">現勘日期：${reportDateStr}</p><img id="report-map-snap" src="${mapImgData}"></div>`;
        const itemsPerPage = 4;
        for (let i = 0; i < photosData.length; i += itemsPerPage) {
            const pageItems = photosData.slice(i, i + itemsPerPage);
            html += `<div class="report-page"><div class="report-title" style="font-size:18px;">現勘紀錄明細 (第 ${Math.floor(i/itemsPerPage)+1} 頁)</div><div class="report-grid">`;
            pageItems.forEach((d, idx) => {
                const gIdx = i + idx + 1;
                html += `<div class="report-item"><div style="display:flex; justify-content:space-between"><strong>[ ${gIdx} ] ${d.time.toLocaleString()}</strong><span style="color:red">⬆ ${Math.round(d.heading)}°</span></div><img src="${d.url}"><div style="font-size:12px">座標: ${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}</div><div style="background:#f4f4f4; padding:8px; flex-grow:1; border-left:4px solid blue; font-size:13px; white-space:pre-wrap;">${d.note || '(無備註)'}</div></div>`;
            });
            html += `</div></div>`;
        }
        document.getElementById('report-content').innerHTML = html;
    }
</script>
</body>
</html>
